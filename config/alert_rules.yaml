alerts:
  - name: api_latency_slo_breach
    severity: critical
    condition: "latency_p95_ms > 3000 for 5m"
    type: symptom-based
    owner: sre-oncall
    runbook: docs/alerts.md#alert-1
  - name: api_error_budget_burn
    severity: critical
    condition: "error_rate_pct > 2 for 10m"
    type: symptom-based
    owner: platform-backend
    runbook: docs/alerts.md#alert-2
  - name: quality_cost_regression
    severity: warning
    condition: "quality_score_avg < 0.75 for 15m or daily_cost_usd > 2.5 for 1d"
    type: symptom-based
    owner: ai-platform
    runbook: docs/alerts.md#alert-3
